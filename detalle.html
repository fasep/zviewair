<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZVIEW.AIR — Detalle</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Space+Mono&display=swap" rel="stylesheet">
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  :root {
    --black: #0a0a0a;
    --white: #f5f3ef;
    --warm: #e8e3d8;
    --accent: #c4a882;
    --ocean: #1a3a4a;
    --sand: #b8a48c;
    --mist: #d4cfc6;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Cormorant Garamond', Georgia, serif;
    overflow-x: hidden;
    cursor: none;
  }

  /* Custom cursor */
  .cursor {
    position: fixed; width: 8px; height: 8px;
    background: var(--accent); border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transition: transform 0.15s ease;
    mix-blend-mode: difference;
  }
  .cursor-ring {
    position: fixed; width: 36px; height: 36px;
    border: 1px solid rgba(196,168,130,0.5); border-radius: 50%;
    pointer-events: none; z-index: 9998;
    transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  @media (pointer: coarse) {
    .cursor, .cursor-ring { display: none; }
    body, a, button { cursor: auto; }
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 28px 48px; display: flex;
    justify-content: space-between; align-items: center;
  }
  nav::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(10,10,10,0.95) 0%, transparent 100%);
    pointer-events: none;
  }
  .nav-logo {
    font-family: 'Cormorant Garamond', serif; font-size: 18px;
    font-weight: 300; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--white); text-decoration: none; position: relative;
  }
  .nav-logo span { color: var(--accent); }
  .nav-back {
    font-family: 'Space Mono', monospace; font-size: 10px;
    letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--mist); text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    padding-bottom: 2px; position: relative;
    transition: color 0.3s, border-color 0.3s;
  }
  .nav-back:hover { color: var(--accent); border-color: var(--accent); }

  /* HERO FOTO PRINCIPAL */
  .hero {
    height: 100vh; height: 100svh; position: relative;
    display: flex; align-items: flex-end;
    padding: 0 48px 80px; overflow: hidden;
  }
  .hero-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
    object-position: center;
  }
  .hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top,
      rgba(10,10,10,0.92) 0%,
      rgba(10,10,10,0.3) 50%,
      rgba(10,10,10,0.1) 100%);
  }
  .hero-content {
    position: relative; max-width: 800px;
  }
  .hero-label {
    font-family: 'Space Mono', monospace; font-size: 10px;
    letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 16px;
  }
  .hero-title {
    font-size: clamp(40px, 7vw, 90px); font-weight: 300;
    line-height: 0.95; letter-spacing: -0.02em;
    margin-bottom: 32px;
  }
  .hero-title em { font-style: italic; color: var(--accent); display: block; }
  .hero-cta-row {
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  }
  .btn-wa {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 28px;
    border: 1px solid rgba(37,211,102,0.4);
    color: #25d366; background: rgba(37,211,102,0.06);
    font-family: 'Space Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase;
    text-decoration: none; transition: all 0.3s; cursor: none;
  }
  .btn-wa:hover { background: rgba(37,211,102,0.15); border-color: rgba(37,211,102,0.7); }
  .btn-encargo {
    color: var(--mist); font-family: 'Space Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em; text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 2px;
    transition: all 0.3s; cursor: none;
  }
  .btn-encargo:hover { color: var(--accent); border-color: var(--accent); }

  /* SECCIÓN MOCKUPS */
  .mockups {
    padding: 120px 48px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .section-label {
    font-family: 'Space Mono', monospace; font-size: 10px;
    letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 48px;
  }

  /* Imagen focal */
  .mockup-featured {
    width: 100%; aspect-ratio: 16/9;
    overflow: hidden; margin-bottom: 16px;
    background: rgba(255,255,255,0.03);
  }
  .mockup-featured img {
    width: 100%; height: 100%;
    object-fit: contain;
    transition: opacity 0.4s ease;
  }
  .mockup-featured img.fade { opacity: 0; }

  /* Grilla de thumbnails */
  .mockups-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 8px;
  }
  .mockup-item {
    overflow: hidden; cursor: none;
    aspect-ratio: 4/3;
    opacity: 0.55;
    transition: opacity 0.3s;
  }
  .mockup-item img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }
  .mockup-item:hover { opacity: 1; }
  .mockup-item:hover img { transform: scale(1.05); }
  .mockup-item.active { opacity: 1; outline: 1px solid var(--accent); }

  /* Placeholder cuando no hay mockups */
  .mockups-placeholder {
    border: 1px dashed rgba(196,168,130,0.2);
    padding: 80px 40px; text-align: center;
    color: var(--mist);
  }
  .mockups-placeholder p {
    font-family: 'Space Mono', monospace; font-size: 10px;
    letter-spacing: 0.3em; text-transform: uppercase;
    opacity: 0.5;
  }

  /* FOOTER */
  footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 48px 48px; border-top: 1px solid rgba(255,255,255,0.06);
    flex-wrap: wrap; gap: 24px;
  }
  .footer-logo {
    font-family: 'Cormorant Garamond', serif; font-size: 16px;
    font-weight: 300; letter-spacing: 0.3em; text-transform: uppercase;
  }
  .footer-logo span { color: var(--accent); }
  .footer-copy {
    font-family: 'Space Mono', monospace; font-size: 9px;
    letter-spacing: 0.2em; color: var(--sand); text-transform: uppercase;
  }

  /* BOTÓN FLOTANTE WHATSAPP */
  .wa-fab {
    position: fixed;
    right: 28px;
    bottom: 28px;
    z-index: 90;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: #25d366;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    cursor: none;
    transition: transform 0.3s ease;
  }
  .wa-fab:hover { transform: scale(1.08); }
  .wa-fab svg { width: 28px; height: 28px; fill: #0a0a0a; }
  .wa-fab::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #25d366;
    opacity: 0.5;
    animation: waPulse 2.2s ease-out infinite;
  }
  @keyframes waPulse {
    0% { transform: scale(1); opacity: 0.5; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  @media (max-width: 900px) {
    nav { padding: 24px; }
    .hero { padding: 0 24px 60px; }
    .mockups { padding: 80px 24px; }
    .mockups-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    footer { padding: 48px 24px; flex-direction: column; text-align: center; }
    .wa-fab { right: 20px; bottom: 20px; width: 52px; height: 52px; }
    .wa-fab svg { width: 25px; height: 25px; }
  }

  @media (max-width: 480px) {
    .hero-cta-row { flex-direction: column; align-items: flex-start; gap: 14px; }
    .btn-wa, .btn-encargo { width: 100%; }
    .btn-wa { justify-content: center; }
  }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>

<section class="mockups">

<footer>
  <div class="footer-logo">Z<span>VIEW</span>.AIR</div>
  <div class="footer-copy">© 2025 Felipe Sepúlveda · Fine Art Aerial Photography</div>
</footer>

  <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
</a>

<script>
  // ─── DATOS DE PRODUCTOS ───────────────────────────────────────────────────
  // Para agregar mockups: añade las rutas en el array "mockups" de cada producto.
  // Ejemplo: mockups: ['images/mockups/tongoy_sala.jpg', 'images/mockups/tongoy_oficina.jpg']
  const products = {
    'transbordador-niebla': {
      title: 'Transbordador<br><em>· Niebla</em>',
      image: 'images/transbordador_niebla.jpg',
      mockups: ['images/mockups/transvaldivia_madera.png','images/mockups/transvaldivia_industrial.png' , 'images/mockups/transvaldivia_negro.png']
    },
    'laguna-cejar': {
      title: 'Laguna<br><em>Cejar</em>',
      image: 'images/laguna_cejar.jpg',
      mockups: ['images/mockups/cejar_madera.png','images/mockups/cejar_pieza.png' , 'images/mockups/cejar_negro.png']
    },
    'ojo-de-cejar': {
      title: 'Ojo<br><em>de Cejar</em>',
      image: 'images/ojo_de_cejar.jpg',
      mockups: ['images/mockups/ojo_cejar1.png', 'images/mockups/ojo_cejar2.png', 'images/mockups/ojo_cejar3.png' ]
    },
    'tongoy-uno': {
      title: 'Tongoy<br><em>· Uno</em>',
      image: 'images/Tongoy_uno.jpg',
      mockups: []
    },
    'tongoy-varios': {
      title: 'Tongoy<br><em>· Varios</em>',
      image: 'images/Tongoy_varios.jpg',
      mockups: []
    },
    'muelle-valdivia': {
      title: 'Muelle<br><em>Valdivia</em>',
      image: 'images/muelle_valdivia.jpg',
      mockups: []
    },
    'ojos-del-salado': {
      title: 'Ojos<br><em>del Salado</em>',
      image: 'images/ojos_del_salado.jpg',
      mockups: []
    },
    'la-boca': {
      title: 'La<br><em>Boca</em>',
      image: 'images/la_boca.jpg',
      mockups: []
    },
    'mar-la-boca': {
      title: 'Mar<br><em>· La Boca</em>',
      image: 'images/mar_la_boca.jpg',
      mockups: []
    },
  };

  // ─── RENDER ───────────────────────────────────────────────────────────────
  const id = new URLSearchParams(window.location.search).get('id');
  const product = products[id];

  if (product) {
    document.title = `ZVIEW.AIR — ${id.replace(/-/g, ' ')}`;
    document.getElementById('heroImg').src = product.image;
    document.getElementById('heroImg').alt = product.title.replace(/<[^>]+>/g, '');
    document.getElementById('heroTitle').innerHTML = product.title;

    const container = document.getElementById('mockupsContainer');
    if (product.mockups.length > 0) {
      // Imagen focal
      const featured = document.createElement('div');
      featured.className = 'mockup-featured';
      const featuredImg = document.createElement('img');
      featuredImg.src = product.mockups[0];
      featuredImg.alt = 'Mockup';
      featured.appendChild(featuredImg);
      container.appendChild(featured);

      // Grilla de thumbnails
      const grid = document.createElement('div');
      grid.className = 'mockups-grid';
      product.mockups.forEach((src, i) => {
        const item = document.createElement('div');
        item.className = 'mockup-item' + (i === 0 ? ' active' : '');
        item.innerHTML = `<img src="${src}" alt="Mockup">`;
        item.addEventListener('click', () => {
          featuredImg.classList.add('fade');
          setTimeout(() => {
            featuredImg.src = src;
            featuredImg.classList.remove('fade');
          }, 200);
          grid.querySelectorAll('.mockup-item').forEach(el => el.classList.remove('active'));
          item.classList.add('active');
        });
        grid.appendChild(item);
      });
      container.appendChild(grid);
    } else {
      container.innerHTML = `
        <div class="mockups-placeholder">
          <p>Imágenes en escena próximamente</p>
        </div>`;
    }
  } else {
    window.location.href = 'index.html';
  }

  // ─── CURSOR ───────────────────────────────────────────────────────────────
  if (!window.matchMedia('(pointer: coarse)').matches) {
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursorRing');
    let mx = 0, my = 0, rx = 0, ry = 0;
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      cursor.style.left = mx - 4 + 'px';
      cursor.style.top = my - 4 + 'px';
    });
    function animRing() {
      rx += (mx - rx - 18) * 0.12;
      ry += (my - ry - 18) * 0.12;
      ring.style.left = rx + 'px';
      ring.style.top = ry + 'px';
      requestAnimationFrame(animRing);
    }
    animRing();
    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('mouseenter', () => {
        cursor.style.transform = 'scale(2.5)';
        ring.style.transform = 'scale(1.5)';
        ring.style.borderColor = 'rgba(196,168,130,0.8)';
      });
      el.addEventListener('mouseleave', () => {
        cursor.style.transform = 'scale(1)';
        ring.style.transform = 'scale(1)';
        ring.style.borderColor = 'rgba(196,168,130,0.5)';
      });
    });
  }
</script>
